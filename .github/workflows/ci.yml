name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'noci')"
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix flake check
        run: nix flake check -L

      - name: install setuid fusermount3
        run: sudo apt-get update && sudo apt-get install -y fuse3

      # Prepend /usr/bin so the setuid system fusermount3 wins over the dev shell's.
      - name: integration tests (diod + FUSE)
        run: nix develop -c bash -c 'export PATH="/usr/bin:$PATH"; cargo test'
