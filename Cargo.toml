[package]
name = "p9fuse"
version = "0.2.0"
edition = "2021"
description = "Mount a remote 9p2000.L filesystem locally over FUSE, unprivileged."
license = "MIT"
readme = "README.md"
repository = "https://github.com/codedownio/p9fuse"
keywords = ["plan9", "fuse", "filesystem", "ninep", "mount"]
categories = ["filesystem", "network-programming"]

[[bin]]
name = "p9fuse"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# codec = BytesCodec, used to expose raw TCP/Unix sockets as byte-chunk sinks/streams (see transport.rs).
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures-util = "0.3"
nix = { version = "0.29", features = ["mount", "socket", "user"] }
# Only needed for the (optional) websocket transport; TCP/Unix builds don't touch it.
tokio-tungstenite = "0.24"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# default-features=false drops the libfuse C linkage: fuser mounts by exec'ing the setuid
# `fusermount3` helper instead, which keeps this a pure-Rust build (no C buildInputs in the nix
# derivation) AND is exactly what lets an unprivileged process mount without CAP_SYS_ADMIN.
# abi-7-31 (without libfuse) enables the modern FUSE opcodes we rely on -- READDIRPLUS (7.21) and
# the WRITEBACK_CACHE cap (7.23); the default min ABI (7.8) compiles those dispatches out.
fuser = { version = "0.14", default-features = false, features = ["abi-7-31"] }
libc = "0.2"
# RFC 3986 percent-encoding for the invalidation path: a filename may contain the newline that
# delimits one request from the next. Zero further dependencies.
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1

# CI runs clippy with -D warnings, so everything here set to "warn" fails CI.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
# Silent integer truncation is the easiest way for 9p message encoding to go wrong.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
